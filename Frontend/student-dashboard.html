<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educore - Student Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="sidebar">
    <h2>Educore</h2>
    <nav>
      <a href="student-dashboard.html" class="active"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="#"><span class="nav-icon">📚</span> Notes</a>
      <a href="#"><span class="nav-icon">📝</span> Assignments</a>
      <a href="#"><span class="nav-icon">🎥</span> Live Classes</a>
      <a href="#"><span class="nav-icon">✅</span> Attendance</a>
    </nav>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="main-content">
    <div class="welcome-banner">
      <h1 id="welcomeName">Welcome...</h1>
      <p id="welcomeDetails">Loading your details...</p>
    </div>

    <div class="cards-grid" id="statsGrid" style="margin-bottom: 2rem;">
      <div class="stat-card">
        <div class="stat-icon">📖</div>
        <div class="stat-number" id="statUnits">--</div>
        <div class="stat-label">Enrolled Units</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📄</div>
        <div class="stat-number" id="statNotes">--</div>
        <div class="stat-label">Notes Available</div>
      </div>

      <div class="stat-card warning">
        <div class="stat-icon">⏳</div>
        <div class="stat-number" id="statPendingCats">--</div>
        <div class="stat-label">Pending CATs</div>
      </div>

      <div class="stat-card warning">
        <div class="stat-icon">📅</div>
        <div class="stat-number" id="statDeadline" style="font-size:1.1rem;">--</div>
        <div class="stat-label" id="statDeadlineLabel">Next Deadline</div>
      </div>
    </div>

    <h2 style="color:#1a3c6e; margin-bottom:1rem;">My Units</h2>
    <div class="units-grid" id="unitsGrid">
